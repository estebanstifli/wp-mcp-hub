<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>WP MCP Hub</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #172033; background: #f5f7fb; } * { box-sizing: border-box; } body { margin: 0; min-width: 320px; } button, input, select { font: inherit; } button { cursor: pointer; } .shell { max-width: 1240px; margin: 0 auto; padding: 32px 24px 48px; } .topbar, .section-heading, .tool-top { display: flex; justify-content: space-between; gap: 16px; } .topbar { align-items: center; margin-bottom: 28px; } .brand, .toolbar, .actions, .site-header, .site-meta, .tabs { display: flex; align-items: center; gap: 9px; } .brand { gap: 13px; } .brand-mark { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 13px; color: #fff; background: linear-gradient(135deg,#6256e8,#3184e7); box-shadow: 0 9px 20px #4e61c735; } h1, h2, h3 { margin: 0; letter-spacing: -.03em; } h1 { font-size: 20px; } h2 { font-size: 20px; } .eyebrow, .muted, .site-url, .tool-description, .operation, .tools-summary { color: #69758a; font-size: 14px; } .eyebrow, .muted { margin: 5px 0 0; } .privacy { color:#526075; font-size:13px; background:#e9eef8; border-radius:999px; padding:8px 12px; white-space:nowrap; } .tabs { padding:5px; margin-bottom:25px; width:max-content; max-width:100%; overflow:auto; background:#e9edf5; border-radius:12px; } .tab { color:#627087; border:0; border-radius:8px; background:transparent; padding:9px 14px; font-weight:650; font-size:14px; white-space:nowrap; } .tab.active { background:#fff; color:#27314b; box-shadow:0 1px 3px #17203319; } .panel { display:none; } .panel.active { display:block; } .section-heading { align-items:end; margin:0 0 16px; } .site-grid, .tools-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(310px,1fr)); gap:16px; } .site-card, .card, .tool-card { border:1px solid #e3e8f2; background:#fff; border-radius:16px; box-shadow:0 5px 18px #24344f08; } .site-card { padding:18px; } .site-header { min-width:0; } .site-icon { width:40px; height:40px; border-radius:11px; object-fit:contain; padding:7px; border:1px solid #e5eaf3; background:#f7f9fd; } .site-icon.fallback { display:grid; place-items:center; padding:0; color:#536078; font-size:18px; font-weight:750; } .site-name, .site-url { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .site-name { font-size:16px; } .site-url { margin:3px 0 0; font-size:12px; } .site-meta { margin:16px 0; color:#6e7a8f; font-size:12px; } .dot { width:7px; height:7px; border-radius:50%; background:#9aa6b8; } .status-connected .dot { background:#22a66c; box-shadow:0 0 0 4px #22a66c18; } .status-error .dot { background:#e55958; } .actions { flex-wrap:wrap; } .button { display:inline-flex; align-items:center; gap:6px; border:1px solid #dce3ef; border-radius:9px; background:#fff; color:#394761; padding:8px 10px; font-weight:650; font-size:13px; } .button:hover { border-color:#9da8bd; background:#f8faff; } .button.primary { border-color:#6256e8; background:#6256e8; color:#fff; } .button.primary:hover { background:#5145d8; } .button.danger { color:#bf3d45; } .button.icon { margin-left:auto; } .lucide { width:16px; height:16px; stroke-width:2; } .empty { padding:42px 24px; text-align:center; color:#788499; border:1px dashed #ccd5e2; border-radius:16px; background:#fbfcfe; } .form-card { max-width:690px; padding:24px; } .field { display:block; margin:16px 0; color:#37435a; font-size:13px; font-weight:650; } input[type=text], input[type=url], input[type=number], select, .search { display:block; width:100%; margin-top:7px; padding:11px 12px; border:1px solid #d7deea; border-radius:9px; background:#fff; color:#172033; outline:none; } input:focus, select:focus { border-color:#6256e8; box-shadow:0 0 0 3px #6256e81c; } .checkbox { display:flex; gap:9px; align-items:start; color:#59667d; font-size:13px; } .checkbox input { margin-top:2px; } .form-footer { display:flex; justify-content:flex-end; margin-top:20px; } .split { display:grid; grid-template-columns:minmax(0,1fr) minmax(310px,.68fr); gap:18px; } .log-card, .operations-card { padding:20px; } textarea { width:100%; min-height:380px; resize:vertical; padding:12px; border:1px solid #dce3ef; border-radius:10px; background:#101827; color:#c8d3e7; font:12px/1.55 ui-monospace,monospace; } .operation { padding:12px 0; border-bottom:1px solid #edf0f5; } .tool-card { padding:15px; } .tool-top { align-items:start; } .tool-name, .dialog-tool-name { font:13px ui-monospace,monospace; overflow-wrap:anywhere; } .tool-name { color:#303d59; font-weight:750; } .tool-description { line-height:1.45; margin:10px 0 14px; min-height:38px; } .empty-description { font-style:italic; } .small-button { padding:6px 8px; font-size:12px; } dialog { max-width:min(600px,calc(100% - 28px)); width:100%; border:0; border-radius:16px; padding:0; box-shadow:0 24px 70px #17203355; } dialog::backdrop { background:#17203388; } .dialog-body { padding:22px; } .dialog-title { margin:0 0 7px; font-size:18px; } .dialog-tool-name { color:#5d54ca; } pre { max-height:230px; overflow:auto; padding:12px; border-radius:9px; background:#f3f6fb; color:#37435a; font:12px/1.45 ui-monospace,monospace; } .dialog-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:18px; } #toast { position:fixed; right:22px; bottom:22px; max-width:min(420px,calc(100% - 44px)); z-index:3; transform:translateY(20px); opacity:0; pointer-events:none; padding:12px 15px; border-radius:10px; background:#26334b; color:#fff; box-shadow:0 10px 25px #1720333c; transition:.2s; font-size:14px; } #toast.show { transform:translateY(0); opacity:1; } #toast.error { background:#a63b45; } html[data-theme=dark] { color-scheme:dark; background:#101621; } html[data-theme=dark] body { color:#e7ecf6; background:#101621; } html[data-theme=dark] .eyebrow, html[data-theme=dark] .muted, html[data-theme=dark] .site-url, html[data-theme=dark] .site-meta, html[data-theme=dark] .tool-description, html[data-theme=dark] .operation { color:#aab5c7; } html[data-theme=dark] .privacy, html[data-theme=dark] .tabs { background:#1a2333; color:#bac5d8; } html[data-theme=dark] .tab { color:#abb7ca; } html[data-theme=dark] .tab.active { background:#28344a; color:#fff; box-shadow:none; } html[data-theme=dark] .site-card, html[data-theme=dark] .card, html[data-theme=dark] .tool-card, html[data-theme=dark] dialog { background:#182131; border-color:#2c3a50; box-shadow:0 5px 18px #0003; } html[data-theme=dark] .site-icon { background:#222d40; border-color:#33425a; } html[data-theme=dark] .button { background:#202b3d; color:#e0e6f1; border-color:#35435a; } html[data-theme=dark] .button:hover { background:#2a374c; border-color:#607090; } html[data-theme=dark] .button.primary { background:#7568f4; border-color:#7568f4; } html[data-theme=dark] .button.danger { color:#ff8e96; } html[data-theme=dark] input, html[data-theme=dark] select, html[data-theme=dark] .search { background:#101827; color:#edf1f8; border-color:#35435a; } html[data-theme=dark] .field, html[data-theme=dark] .checkbox { color:#c4cede; } html[data-theme=dark] .empty, html[data-theme=dark] pre { background:#131b29; color:#c7d2e5; border-color:#35435a; } html[data-theme=dark] .dialog-tool-name { color:#aaa3ff; } @media (max-width:760px) { .shell { padding:22px 15px 38px; } .topbar { align-items:flex-start; } .privacy { display:none; } .split { grid-template-columns:1fr; } .section-heading { align-items:start; flex-direction:column; } .search { width:100%; } }
    .subtabs { display:flex; gap:14px; margin-bottom:16px; border-bottom:1px solid #e3e8f2; } .subtab { border:0; border-bottom:2px solid transparent; background:transparent; padding:9px 4px; color:#69758a; font-weight:650; } .subtab.active { color:#6256e8; border-bottom-color:#6256e8; } .activity-panel { display:none; } .activity-panel.active { display:block; } .activity-item { padding:14px 0; border-bottom:1px solid #edf0f5; } .activity-details { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:9px; margin-top:10px; } .activity-details pre { margin:0; max-height:160px; } .action-log { min-height:160px; margin-top:12px; } .action-status { display:flex; align-items:center; gap:8px; font-weight:700; } .spinner { width:15px; height:15px; border:2px solid #c8d1e1; border-top-color:#6256e8; border-radius:50%; animation:spin .7s linear infinite; } @keyframes spin { to { transform:rotate(360deg); } }
    .site-grid.rows { grid-template-columns:1fr; } .site-grid.rows .site-card { display:grid; grid-template-columns:minmax(0,1.4fr) auto minmax(370px,.8fr); align-items:center; gap:16px; } .site-grid.rows .site-meta { margin:0; } .site-grid.rows .actions { justify-content:flex-end; } .site-name[contenteditable=true] { border-radius:6px; padding:3px 5px; margin:-3px -5px; outline:none; } .site-name[contenteditable=true]:hover, .site-name[contenteditable=true]:focus { background:#edf1f8; box-shadow:0 0 0 1px #cfd8e8; } html[data-theme=dark] .site-name[contenteditable=true]:hover, html[data-theme=dark] .site-name[contenteditable=true]:focus { background:#26344a; box-shadow:0 0 0 1px #536681; } @media (max-width:900px) { .site-grid.rows .site-card { display:block; } .site-grid.rows .site-meta { margin:16px 0; } .site-grid.rows .actions { justify-content:start; } }
    #site-json-import { min-height:150px; height:150px; }
  </style>
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" defer></script>
</head>
<body>
  <main class="shell">
    <header class="topbar"><div class="brand"><div class="brand-mark"><i data-lucide="blocks"></i></div><div><h1>WP MCP Hub</h1><p class="eyebrow" data-i18n="app.tagline"></p></div></div><div class="toolbar"><span class="privacy" data-i18n="app.privacy"></span><button class="button" id="theme-toggle" onclick="toggleTheme()"><i data-lucide="moon"></i><span></span></button></div></header>
    <nav class="tabs" data-i18n-aria="aria.sections"><button class="tab active" data-tab="sites" data-i18n="nav.sites"></button><button class="tab" data-tab="tools" data-i18n="nav.tools"></button><button class="tab" data-tab="activity" data-i18n="nav.activity"></button><button class="tab" data-tab="settings" data-i18n="nav.settings"></button><button class="tab" data-tab="add"><i data-lucide="plus"></i><span data-i18n="nav.add"></span></button></nav>
    <section class="panel active" id="panel-sites"><div class="section-heading"><div><h2 data-i18n="sites.title"></h2><p class="muted" data-i18n="sites.description"></p></div><button class="button primary" onclick="activateTab('add')"><i data-lucide="plus"></i><span data-i18n="actions.addSite"></span></button></div><div class="site-grid">{% for site in sites %}<article class="site-card status-{{ site.status }}" data-site-id="{{ site.id }}" data-site-name="{{ site.name }}" data-site-url="{{ site.mcp_url }}"><div class="site-header"><img class="site-icon" alt="" referrerpolicy="no-referrer"><div style="min-width:0"><h3 class="site-name">{{ site.name }}</h3><p class="site-url">{{ site.mcp_url }}</p></div></div><div class="site-meta"><span class="dot"></span><span data-status="{{ site.status }}"></span><span>·</span><span>{{ site.transport | replace('_', ' ') }}</span></div><div class="actions"><button class="button primary" onclick="openTools('{{ site.id }}', '{{ site.name }}')"><i data-lucide="wrench"></i><span data-i18n="actions.viewTools"></span></button><button class="button" onclick="pingSite('{{ site.id }}')"><i data-lucide="radio"></i><span data-i18n="actions.ping"></span></button><button class="button" onclick="testSite('{{ site.id }}')"><i data-lucide="stethoscope"></i><span data-i18n="actions.test"></span></button><button class="button" onclick="connectSite('{{ site.id }}')"><i data-lucide="key-round"></i><span data-i18n="actions.connect"></span></button><button class="button danger icon" data-delete-site="{{ site.name }}" onclick="deleteSite('{{ site.id }}')"><i data-lucide="trash-2"></i></button></div></article>{% else %}<div class="empty"><span data-i18n="sites.empty"></span><br><button class="button primary" style="margin-top:14px" onclick="activateTab('add')"><i data-lucide="plus"></i><span data-i18n="actions.addFirstSite"></span></button></div>{% endfor %}</div></section>
    <section class="panel" id="panel-tools"><div class="section-heading"><div><h2 id="tools-title" data-i18n="tools.title"></h2><p class="muted" id="tools-subtitle" data-i18n="tools.selectSite"></p></div><div class="toolbar"><input id="tool-search" class="search" type="search" data-i18n-placeholder="tools.search" oninput="renderTools()"><button class="button" onclick="refreshSelectedTools()"><i data-lucide="refresh-cw"></i><span data-i18n="actions.refresh"></span></button></div></div><p class="tools-summary" id="tools-summary"></p><div class="tools-grid" id="tools-grid"><div class="empty" data-i18n="tools.empty"></div></div></section>
    <section class="panel" id="panel-activity"><div class="subtabs"><button class="subtab active" data-activity-tab="log" data-i18n="activity.logTab"></button><button class="subtab" data-activity-tab="operations" data-i18n="activity.activityTab"></button></div><article class="card log-card activity-panel active" id="activity-log"><div class="section-heading"><div><h2 data-i18n="activity.applicationLog"></h2><p class="muted" data-i18n="activity.logDescription"></p></div><button class="button" onclick="refreshLogs(true)"><i data-lucide="refresh-cw"></i><span data-i18n="actions.refresh"></span></button></div><textarea id="application-log" readonly data-i18n-aria="aria.applicationLog"></textarea></article><article class="card operations-card activity-panel" id="activity-operations"><div class="section-heading"><div><h2 data-i18n="activity.operations"></h2><p class="muted" data-i18n="activity.operationsDescription"></p></div><button class="button" onclick="showOperations()"><i data-lucide="refresh-cw"></i><span data-i18n="actions.refresh"></span></button></div><div id="operations-list" class="muted" data-i18n="activity.loadOperations"></div></article></section>
    <section class="panel" id="panel-settings"><div class="section-heading"><div><h2 data-i18n="settings.title"></h2><p class="muted" data-i18n="settings.description"></p></div></div><div class="split"><div style="display:grid;gap:18px"><article class="card form-card" style="max-width:none"><h2 style="font-size:17px" data-i18n="settings.localWeb"></h2><p class="muted" data-i18n="settings.localWebDescription"></p><form id="web-settings"><label class="field"><span data-i18n="settings.httpPort"></span><input name="web_port" type="number" min="1024" max="65535" required value="{{ web_port }}"></label><div class="form-footer"><button class="button primary"><i data-lucide="save"></i><span data-i18n="actions.savePort"></span></button></div></form><p class="muted" id="port-result"></p></article><article class="card form-card" style="max-width:none"><h2 style="font-size:17px" data-i18n="settings.oauthCredentials"></h2><p class="muted" data-i18n="settings.oauthDescription"></p><div id="credential-details" class="muted" data-i18n="settings.checkingCredentials"></div><p class="muted" data-i18n="settings.credentialHelp"></p></article></div><article class="card form-card" style="max-width:none"><h2 style="font-size:17px" data-i18n="settings.stdioClients"></h2><p class="muted" data-i18n="settings.stdioDescription"></p><pre id="client-config">{
  "mcpServers": {
    "wp-mcp-hub": {"command": {{ mcp_command | tojson }}, "args": {{ mcp_args | tojson }}}
  }
}</pre><button class="button" onclick="copyClientConfig()"><i data-lucide="copy"></i><span data-i18n="actions.copyConfig"></span></button><p class="muted" data-i18n="settings.stdioHelp"></p></article><article class="card form-card" style="max-width:none"><h2 style="font-size:17px" data-i18n="activity.settingsTitle"></h2><p class="muted" data-i18n="activity.settingsDescription"></p><form id="activity-settings"><label class="checkbox"><input name="enabled" type="checkbox" checked><span data-i18n="activity.enabled"></span></label><label class="field"><span data-i18n="activity.traceLevel"></span><select name="trace_level"><option value="tool" data-i18n="activity.toolOnly"></option><option value="tool_and_parameters" data-i18n="activity.toolAndParameters"></option><option value="full" data-i18n="activity.full"></option></select></label><div class="form-footer"><button class="button primary"><i data-lucide="save"></i><span data-i18n="actions.save"></span></button></div></form></article></div></section>
    <section class="panel" id="panel-add"><article class="card form-card"><h2 data-i18n="add.title"></h2><p class="muted" data-i18n="add.description"></p><form id="add-site"><label class="field"><span data-i18n="add.siteName"></span><input name="name" type="text" required maxlength="200" data-i18n-placeholder="add.siteNamePlaceholder"></label><label class="field"><span data-i18n="add.serverUrl"></span><input name="mcp_url" type="url" required placeholder="https://example.com/mcp"></label><label class="field"><span data-i18n="add.transport"></span><select name="transport"><option value="streamable_http">Streamable HTTP</option><option value="sse">SSE (Server-Sent Events)</option></select></label><label class="checkbox"><input name="allow_private_network" type="checkbox"><span data-i18n="add.privateNetwork"></span></label><div class="form-footer"><button class="button primary"><i data-lucide="plus"></i><span data-i18n="actions.addSite"></span></button></div></form></article></section>
  </main>
  <dialog id="tool-dialog"><div class="dialog-body"><h3 class="dialog-title" data-i18n="tools.configure"></h3><div class="dialog-tool-name" id="dialog-tool-name"></div><p class="muted" id="dialog-description"></p><label class="field"><span data-i18n="policy.securityClassification"></span><select id="policy-classification"><option value="unknown" data-i18n="policy.unknown"></option><option value="read" data-i18n="policy.read"></option><option value="write" data-i18n="policy.write"></option><option value="destructive" data-i18n="policy.destructive"></option></select></label><label class="checkbox"><input id="policy-allowed" type="checkbox"><span data-i18n="policy.explicitlyAllow"></span></label><details><summary data-i18n="tools.inputSchema"></summary><pre id="dialog-schema"></pre></details><div class="dialog-actions"><button class="button" onclick="closeToolDialog()" data-i18n="actions.cancel"></button><button class="button primary" onclick="saveToolPolicy()"><i data-lucide="save"></i><span data-i18n="actions.savePolicy"></span></button></div></div></dialog><div id="toast" role="status" aria-live="polite"></div>
  <script>
    const csrf = {{ csrf_token | tojson }}, headers = {'Content-Type':'application/json','X-WP-MCP-Hub-CSRF':csrf}; let i18n = {}, lastLogId = 0, selectedSite = null, selectedTools = [], selectedTool = null, toastTimer;
    function t(key, values = {}) { let value = key.split('.').reduce((item, part) => item && item[part], i18n) || key; return value.replace(/\{(\w+)\}/g, (_, name) => values[name] ?? ''); }
    function iconify() { if (window.lucide) window.lucide.createIcons({attrs:{'aria-hidden':'true'}}); }
    async function initI18n() { const base=await fetch('/static/i18n/en.json').then(response=>response.json()); const preference=localStorage.getItem('wp-mcp-hub-language')||'auto', browser=(navigator.languages||[navigator.language]).map(language=>language.toLowerCase()); const supported=['es','zh-CN','hi','ar','fr','de','pt-BR','ja','ru','ko']; const locale=preference==='auto'?(supported.find(code=>browser.some(language=>language===code.toLowerCase()||language.startsWith(`${code.split('-')[0].toLowerCase()}-`)))||'en'):preference; const translation=locale==='en'?{}:await fetch(`/static/i18n/${locale}.json`).then(response=>response.ok?response.json():{}).catch(()=>({})); i18n=mergeI18n(base,translation); document.documentElement.lang=locale; document.title = t('app.title'); document.querySelectorAll('[data-i18n]').forEach(node => node.textContent=t(node.dataset.i18n)); document.querySelectorAll('[data-i18n-placeholder]').forEach(node => node.placeholder=t(node.dataset.i18nPlaceholder)); document.querySelectorAll('[data-i18n-aria]').forEach(node => node.setAttribute('aria-label', t(node.dataset.i18nAria))); document.querySelectorAll('[data-status]').forEach(node => node.textContent=t(`sites.status.${node.dataset.status}`)); document.querySelectorAll('[data-delete-site]').forEach(node => { const name=node.dataset.deleteSite; node.title=t('aria.deleteSite',{name}); node.setAttribute('aria-label',t('aria.deleteSite',{name})); }); applyTheme(localStorage.getItem('wp-mcp-hub-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark':'light')); iconify(); }
    function mergeI18n(base, override) { return Object.fromEntries(Object.entries(base).map(([key,value])=>[key,value&&typeof value==='object'&&!Array.isArray(value)?mergeI18n(value,override[key]||{}):(override[key]??value)])); }
    function activateTab(name) { document.querySelectorAll('.tab').forEach(tab=>tab.classList.toggle('active',tab.dataset.tab===name)); document.querySelectorAll('.panel').forEach(panel=>panel.classList.toggle('active',panel.id===`panel-${name}`)); if(name==='activity'){showOperations();refreshLogs(true);} if(name==='settings')loadSettings(); }
    document.querySelectorAll('.tab').forEach(tab=>tab.addEventListener('click',()=>activateTab(tab.dataset.tab))); function toast(message,error=false){const node=document.querySelector('#toast');node.textContent=message;node.classList.toggle('error',error);node.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>node.classList.remove('show'),4300);} function applyTheme(theme){document.documentElement.dataset.theme=theme;localStorage.setItem('wp-mcp-hub-theme',theme);const toggle=document.querySelector('#theme-toggle');toggle.querySelector('span').textContent=t(theme==='dark'?'actions.toggleLight':'actions.toggleDark');const previous=toggle.querySelector('svg');if(previous){const icon=document.createElement('i');icon.dataset.lucide=theme==='dark'?'sun':'moon';previous.replaceWith(icon);}iconify();} function toggleTheme(){applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');}
    document.querySelectorAll('.site-card').forEach(card=>{const icon=card.querySelector('.site-icon');try{const url=new URL(card.dataset.siteUrl);icon.src=`${url.origin}/favicon.ico`;icon.onerror=()=>{icon.removeAttribute('src');icon.outerHTML=`<div class="site-icon fallback" aria-hidden="true">${card.dataset.siteName.trim().slice(0,1).toUpperCase()}</div>`;};}catch(_){icon.classList.add('fallback');}});
    document.querySelector('#add-site').addEventListener('submit',async event=>{event.preventDefault();const form=new FormData(event.target),body={name:form.get('name'),mcp_url:form.get('mcp_url'),transport:form.get('transport'),allow_private_network:form.has('allow_private_network')};const response=await fetch('/sites',{method:'POST',headers,body:JSON.stringify(body)});response.ok?location.reload():toast(await response.text(),true);});
    async function testSite(id){toast(t('messages.testing'));const response=await fetch(`/sites/${id}/test`,{method:'POST',headers}),result=await response.json();if(!response.ok)return toast(JSON.stringify(result),true);toast(t('messages.testOk',{tools:result.tool_count??0,duration:result.duration_ms}));location.reload();} async function pingSite(id){toast(t('messages.pinging'));const response=await fetch(`/sites/${id}/ping`,{method:'POST',headers}),result=await response.json();if(!response.ok||result.status!=='ok')return toast(t('messages.pingFailed',{error:result.error||JSON.stringify(result)}),true);toast(t('messages.pingOk',{duration:result.duration_ms}));} async function connectSite(id){const response=await fetch(`/sites/${id}/connect`,{method:'POST',headers,body:'{}'}),result=await response.json();result.authorization_url?location.href=result.authorization_url:toast(JSON.stringify(result),true);}
    async function openTools(id,name){selectedSite={id,name};activateTab('tools');document.querySelector('#tools-title').textContent=t('messages.toolsFor',{name});document.querySelector('#tools-subtitle').textContent=t('messages.toolCatalogLoading');document.querySelector('#tools-grid').innerHTML=`<div class="empty">${t('tools.loading')}</div>`;await refreshSelectedTools();} async function refreshSelectedTools(){if(!selectedSite)return toast(t('messages.selectSite'),true);const response=await fetch(`/sites/${selectedSite.id}/tools`);if(!response.ok)return toast(await response.text(),true);selectedTools=await response.json();document.querySelector('#tools-subtitle').textContent=t('tools.catalog');renderTools();} function escapeHtml(value){return String(value).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));} function renderTools(){const query=document.querySelector('#tool-search').value.trim().toLowerCase(),visible=selectedTools.filter(tool=>`${tool.name} ${tool.description||''}`.toLowerCase().includes(query)),grid=document.querySelector('#tools-grid');document.querySelector('#tools-summary').textContent=selectedTools.length?t('tools.count',{visible:visible.length,total:selectedTools.length}):'';if(!visible.length){grid.innerHTML=`<div class="empty">${t('tools.noMatch')}</div>`;return;}grid.innerHTML=visible.map(tool=>`<article class="tool-card"><div class="tool-top"><div class="tool-name">${escapeHtml(tool.name)}</div><button class="button small-button" data-tool-index="${selectedTools.indexOf(tool)}"><i data-lucide="info"></i>${t('actions.details')}</button></div><p class="tool-description ${tool.description?'':'empty-description'}">${escapeHtml(tool.description||t('tools.noDescription'))}</p></article>`).join('');grid.querySelectorAll('[data-tool-index]').forEach(button=>button.addEventListener('click',()=>showToolDialog(selectedTools[Number(button.dataset.toolIndex)])));iconify();} function showToolDialog(tool){selectedTool=tool;document.querySelector('#dialog-tool-name').textContent=tool.name;document.querySelector('#dialog-description').textContent=tool.description||t('tools.noDescription');document.querySelector('#dialog-schema').textContent=JSON.stringify(tool.input_schema||{},null,2);document.querySelector('#policy-classification').value='unknown';document.querySelector('#policy-allowed').checked=false;document.querySelector('#tool-dialog').showModal();} function closeToolDialog(){document.querySelector('#tool-dialog').close();} async function saveToolPolicy(){if(!selectedSite||!selectedTool)return;const classification=document.querySelector('#policy-classification').value,explicitly_allowed=document.querySelector('#policy-allowed').checked,response=await fetch(`/sites/${selectedSite.id}/tools/${encodeURIComponent(selectedTool.name)}/policy`,{method:'PUT',headers,body:JSON.stringify({classification,explicitly_allowed})});if(response.ok){closeToolDialog();toast(t('policy.updated'));}else toast(await response.text(),true);}
    async function showOperations(){const response=await fetch('/operations');if(!response.ok)return toast(await response.text(),true);const operations=await response.json(),list=document.querySelector('#operations-list');list.innerHTML=operations.length?operations.map(operation=>`<div class="operation"><strong>${escapeHtml(operation.remote_tool_name||operation.operation_type||'')}</strong><br><span>${escapeHtml(operation.created_at||'')}</span></div>`).join(''):`<span class="muted">${t('activity.noOperations')}</span>`;} async function loadSettings(){const response=await fetch('/settings');if(!response.ok)return;const settings=await response.json();document.querySelector('#web-settings [name=web_port]').value=settings.web_port;document.querySelector('#credential-details').textContent=t(settings.credential_backend_available?'settings.secureBackend':'settings.noSecureBackend',{backend:settings.credential_backend});} document.querySelector('#web-settings').addEventListener('submit',async event=>{event.preventDefault();const port=Number(new FormData(event.target).get('web_port')),response=await fetch('/settings/web',{method:'PUT',headers,body:JSON.stringify({web_port:port})}),result=await response.json(),output=document.querySelector('#port-result');if(!response.ok)return toast(JSON.stringify(result),true);output.textContent=t('settings.portSaved',{url:result.next_url});toast(t('settings.portToast'));}); async function copyClientConfig(){try{await navigator.clipboard.writeText(document.querySelector('#client-config').textContent);toast(t('messages.configCopied'));}catch(_){toast(t('messages.copyFailed'),true);}} async function refreshLogs(forceScroll=false){try{const response=await fetch(`/logs?after=${lastLogId}&limit=200`);if(!response.ok)return;const entries=await response.json();if(!entries.length)return;const output=document.querySelector('#application-log'),wasAtBottom=output.scrollTop+output.clientHeight>=output.scrollHeight-10;output.value+=`${output.value?'\n':''}${entries.map(entry=>`${entry.timestamp} ${entry.level.padEnd(7)} ${entry.logger}: ${entry.message}`).join('\n')}`;lastLogId=entries[entries.length-1].id;if(forceScroll||wasAtBottom)output.scrollTop=output.scrollHeight;}catch(_){}} async function deleteSite(id){if(!confirm(t('messages.confirmDelete')))return;const response=await fetch(`/sites/${id}`,{method:'DELETE',headers});response.ok?location.reload():toast(await response.text(),true);} initI18n().then(()=>{refreshLogs(true);setInterval(refreshLogs,2000);}); window.addEventListener('load',iconify);
    let actionLogId = 0, actionLogTimer = null;
    function appendActionLine(message) { const output=document.querySelector('#action-log'); output.value += `${output.value?'\n':''}${message}`; output.scrollTop=output.scrollHeight; }
    async function refreshActionLogs() { try { const response=await fetch(`/logs?after=${actionLogId}&limit=100`); if(!response.ok)return; const entries=await response.json(); if(!entries.length)return; entries.forEach(entry=>appendActionLine(`${entry.timestamp} ${entry.level}: ${entry.message}`)); actionLogId=entries[entries.length-1].id; } catch (_) {} }
    function beginAction(title, message) { const dialog=document.querySelector('#action-dialog'); actionLogId=lastLogId; document.querySelector('#action-title').textContent=title; document.querySelector('#action-log').value=''; document.querySelector('#action-status span:last-child').textContent=t('execution.working'); document.querySelector('#action-status .spinner').style.display='inline-block'; document.querySelector('#action-close').disabled=true; appendActionLine(message); dialog.showModal(); actionLogTimer=setInterval(refreshActionLogs,500); }
    function finishAction(success, message) { clearInterval(actionLogTimer); refreshActionLogs(); document.querySelector('#action-status span:last-child').textContent=message; document.querySelector('#action-status .spinner').style.display='none'; document.querySelector('#action-close').disabled=false; document.querySelector('#action-status').style.color=success?'#168354':'#bf3d45'; }
    function closeActionDialog() { clearInterval(actionLogTimer); document.querySelector('#action-dialog').close(); }
    async function runAction(title, message, action) { beginAction(title,message); try { const result=await action(); appendActionLine(JSON.stringify(result,null,2)); finishAction(true,t('execution.success')); return result; } catch(error) { appendActionLine(String(error)); finishAction(false,t('execution.failed')); throw error; } }
    async function actionRequest(url, options) { const response=await fetch(url,options); const payload=await response.json().catch(async()=>await response.text()); if(!response.ok) throw new Error(typeof payload==='string'?payload:JSON.stringify(payload)); return payload; }
    async function testSite(id) { const result=await runAction(t('actions.test'),t('messages.testing'),()=>actionRequest(`/sites/${id}/test`,{method:'POST',headers})); if(result.status!=='ok') { finishAction(false,result.errors?.join('\n')||t('execution.failed')); return; } finishAction(true,t('messages.testOk',{tools:result.tool_count??0,duration:result.duration_ms})); setTimeout(()=>location.reload(),900); }
    async function pingSite(id) { const result=await runAction(t('actions.ping'),t('messages.pinging'),()=>actionRequest(`/sites/${id}/ping`,{method:'POST',headers})); if(result.status!=='ok') finishAction(false,t('messages.pingFailed',{error:result.error||''})); else finishAction(true,t('messages.pingOk',{duration:result.duration_ms})); }
    async function connectSite(id) { const result=await runAction(t('actions.connect'),t('execution.starting'),()=>actionRequest(`/sites/${id}/connect`,{method:'POST',headers,body:'{}'})); appendActionLine(t('execution.authorization')); document.querySelector('#action-status span:last-child').textContent=t('execution.waitingAuthorization'); setTimeout(()=>location.href=result.authorization_url,650); }
    async function openTools(id,name) { const result=await runAction(t('actions.viewTools'),t('messages.toolCatalogLoading'),()=>actionRequest(`/sites/${id}/tools`)); selectedSite={id,name}; selectedTools=result; appendActionLine(t('execution.viewTools')); finishAction(true,t('execution.success')); activateTab('tools'); document.querySelector('#tools-title').textContent=t('messages.toolsFor',{name}); document.querySelector('#tools-subtitle').textContent=t('tools.catalog'); renderTools(); }
    async function deleteSite(id) { if(!confirm(t('messages.confirmDelete'))) return; await runAction(t('actions.delete'),t('execution.deleting'),()=>actionRequest(`/sites/${id}`,{method:'DELETE',headers})); finishAction(true,t('execution.deleted')); setTimeout(()=>location.reload(),700); }
    function activateActivityTab(name) { document.querySelectorAll('[data-activity-tab]').forEach(tab=>tab.classList.toggle('active',tab.dataset.activityTab===name)); document.querySelectorAll('.activity-panel').forEach(panel=>panel.classList.toggle('active',panel.id===`activity-${name}`)); if(name==='operations')showOperations(); }
    document.querySelectorAll('[data-activity-tab]').forEach(tab=>tab.addEventListener('click',()=>activateActivityTab(tab.dataset.activityTab)));
    async function showOperations() { const operations=await actionRequest('/operations'); const list=document.querySelector('#operations-list'); list.innerHTML=operations.length?operations.map(operation=>{const parameters=operation.parameters||{}, results=operation.results||[]; return `<article class="activity-item"><strong>${escapeHtml(parameters.remote_tool_name||operation.kind)}</strong><span class="muted"> · ${escapeHtml(operation.status)} · ${escapeHtml(operation.started_at||'')}</span><div class="activity-details"><div><small>${t('activity.parameters')}</small><pre>${escapeHtml(JSON.stringify(parameters,null,2))}</pre></div>${results.map(item=>`<div><small>${t('activity.result')} · ${t('activity.duration',{duration:item.duration_ms})}</small><pre>${escapeHtml(JSON.stringify(item.result,null,2))}</pre></div>`).join('')}</div></article>`;}).join(''):`<span class="muted">${t('activity.noOperations')}</span>`; }
    const previousLoadSettings=loadSettings; loadSettings=async function(){await previousLoadSettings();const response=await fetch('/settings');if(!response.ok)return;const settings=await response.json(),form=document.querySelector('#activity-settings');form.elements.enabled.checked=settings.activity_enabled;form.elements.trace_level.value=settings.activity_trace_level;}; document.querySelector('#activity-settings').addEventListener('submit',async event=>{event.preventDefault();const form=new FormData(event.target);await actionRequest('/settings/activity',{method:'PUT',headers,body:JSON.stringify({enabled:form.has('enabled'),trace_level:form.get('trace_level')})});toast(t('activity.saved'));});
    const callbackStatus=new URLSearchParams(location.search); if(callbackStatus.get('connected')==='1'||callbackStatus.get('oauth_error')){initI18n().then(()=>{beginAction(t('actions.connect'),t('execution.starting'));const error=callbackStatus.get('oauth_error');appendActionLine(error||t('execution.success'));finishAction(!error,error||t('execution.success'));history.replaceState({},'',location.pathname);});}
    function setupSiteViewControl() { if(document.querySelector('#site-view-toggle')) return; const heading=document.querySelector('#panel-sites > .section-heading'); if(!heading)return; const button=document.createElement('button'); button.id='site-view-toggle'; button.className='button'; button.innerHTML='<i data-lucide="list"></i><span></span>'; button.addEventListener('click',toggleSiteView); heading.append(button); applySiteView(localStorage.getItem('wp-mcp-hub-site-view')||'grid'); }
    function applySiteView(view) { const grid=document.querySelector('.site-grid'); if(!grid)return; const rows=view==='rows'; grid.classList.toggle('rows',rows); localStorage.setItem('wp-mcp-hub-site-view',rows?'rows':'grid'); const button=document.querySelector('#site-view-toggle'); if(button){button.querySelector('span').textContent=t(rows?'layout.grid':'layout.rows'); const old=button.querySelector('svg'); if(old){const icon=document.createElement('i');icon.dataset.lucide=rows?'grid-2x2':'list';old.replaceWith(icon);} button.title=t('layout.siteView');} iconify(); }
    function toggleSiteView() { const grid=document.querySelector('.site-grid'); applySiteView(grid?.classList.contains('rows')?'grid':'rows'); }
    function setupInlineSiteNames() { document.querySelectorAll('.site-card .site-name').forEach(node=>{node.contentEditable='true'; node.spellcheck=false; node.dataset.originalName=node.textContent.trim(); node.addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();node.blur();} if(event.key==='Escape'){node.textContent=node.dataset.originalName;node.blur();}}); node.addEventListener('blur',async()=>{const name=node.textContent.trim(),card=node.closest('.site-card'); if(!card||!name||name===node.dataset.originalName){node.textContent=node.dataset.originalName;return;} try{const result=await actionRequest(`/sites/${card.dataset.siteId}`,{method:'PATCH',headers,body:JSON.stringify({name})}); node.textContent=result.name; node.dataset.originalName=result.name; card.dataset.siteName=result.name; const option=document.querySelector(`#activity-site-filter option[value="${card.dataset.siteId}"]`); if(option)option.textContent=result.name; toast(t('layout.nameSaved'));}catch(error){node.textContent=node.dataset.originalName;toast(String(error),true);}}); }); }
    function setupActivitySiteFilter() { if(document.querySelector('#activity-site-filter'))return; const heading=document.querySelector('#activity-operations .section-heading'); if(!heading)return; const select=document.createElement('select'); select.id='activity-site-filter'; select.className='search'; select.style.width='min(250px,100%)'; select.innerHTML=`<option value="">${t('layout.allSites')}</option>${[...document.querySelectorAll('.site-card')].map(card=>`<option value="${card.dataset.siteId}">${escapeHtml(card.dataset.siteName)}</option>`).join('')}`; select.addEventListener('change',showOperations); heading.append(select); }
    async function showOperations() { const siteId=document.querySelector('#activity-site-filter')?.value||'', operations=await actionRequest(`/operations${siteId?`?site_id=${encodeURIComponent(siteId)}`:''}`), list=document.querySelector('#operations-list'); list.innerHTML=operations.length?operations.map(operation=>{const parameters=operation.parameters||{}, results=operation.results||[]; return `<article class="activity-item"><strong>${escapeHtml(parameters.remote_tool_name||operation.kind)}</strong><span class="muted"> · ${escapeHtml(operation.status)} · ${escapeHtml(operation.started_at||'')}</span><div class="activity-details"><div><small>${t('activity.parameters')}</small><pre>${escapeHtml(JSON.stringify(parameters,null,2))}</pre></div>${results.map(item=>`<div><small>${t('layout.site')}: ${escapeHtml(item.site_name||item.site_id||'')} · ${t('activity.duration',{duration:item.duration_ms})}</small><pre>${escapeHtml(JSON.stringify(item.result,null,2))}</pre></div>`).join('')}</div></article>`;}).join(''):`<span class="muted">${t('activity.noOperations')}</span>`; }
    function setupAuthenticationControls() { const form=document.querySelector('#add-site'); if(!form||form.dataset.authReady)return; form.dataset.authReady='true'; const footer=form.querySelector('.form-footer'); const auth=document.createElement('div'); auth.innerHTML=`<label class="field"><span>${t('layout.authentication')}</span><select name="auth_mode"><option value="oauth">${t('layout.oauth')}</option><option value="static_bearer">${t('layout.bearer')}</option><option value="custom_header">${t('layout.customHeader')}</option><option value="none">${t('layout.noAuth')}</option></select></label><label class="field auth-secret" style="display:none"><span>${t('layout.credential')}</span><input name="secret" type="password" autocomplete="off"></label><label class="field auth-header" style="display:none"><span>${t('layout.headerName')}</span><input name="header_name" type="text" value="X-API-Key" maxlength="200"></label>`; footer.before(auth); const mode=form.elements.auth_mode, sync=()=>{const custom=mode.value==='custom_header', secret=mode.value==='static_bearer'||custom; auth.querySelector('.auth-secret').style.display=secret?'block':'none'; auth.querySelector('.auth-header').style.display=custom?'block':'none';}; mode.addEventListener('change',sync); sync(); const importer=document.createElement('details'); importer.style.marginTop='20px'; importer.innerHTML=`<summary>${t('layout.importJson')}</summary><p class="muted">${t('layout.importJsonHelp')}</p><textarea id="site-json-import" style="min-height:150px"></textarea><div class="form-footer"><button type="button" class="button" id="site-json-import-button"><i data-lucide="upload"></i><span>${t('layout.import')}</span></button></div>`; form.parentElement.append(importer); document.querySelector('#site-json-import-button').addEventListener('click',async()=>{try{const config=JSON.parse(document.querySelector('#site-json-import').value),result=await actionRequest('/sites/import',{method:'POST',headers,body:JSON.stringify({config})});toast(t('layout.imported',{count:result.imported.length}));setTimeout(()=>location.reload(),500);}catch(error){toast(String(error),true);}}); form.addEventListener('submit',async event=>{event.preventDefault();event.stopImmediatePropagation();const data=new FormData(form),body={name:data.get('name'),mcp_url:data.get('mcp_url'),transport:data.get('transport'),allow_private_network:data.has('allow_private_network'),auth_mode:data.get('auth_mode'),secret:data.get('secret')||null,header_name:data.get('header_name')||null};try{await actionRequest('/sites',{method:'POST',headers,body:JSON.stringify(body)});location.reload();}catch(error){toast(String(error),true);}},true); iconify(); }
    async function setupAuthModeButtons() { for(const card of document.querySelectorAll('.site-card')) { try { const auth=await actionRequest(`/sites/${card.dataset.siteId}/auth-mode`), connect=card.querySelector('[onclick^="connectSite"]'); if(connect&&auth.mode!=='oauth') connect.style.display='none'; } catch (_) {} } }
    function setupLanguageControl() { if(document.querySelector('#language-settings'))return; const card=document.createElement('article'); card.className='card form-card'; card.style.maxWidth='none'; const languages=[['auto',t('languages.auto')],['en','English'],['es','Español'],['zh-CN','简体中文'],['hi','हिन्दी'],['ar','العربية'],['fr','Français'],['de','Deutsch'],['pt-BR','Português (Brasil)'],['ja','日本語'],['ru','Русский'],['ko','한국어']]; card.innerHTML=`<h2 style="font-size:17px">${t('languages.label')}</h2><select id="language-settings">${languages.map(([code,name])=>`<option value="${code}">${name}</option>`).join('')}</select>`; document.querySelector('#panel-settings > .split').after(card); const select=card.querySelector('select'); select.value=localStorage.getItem('wp-mcp-hub-language')||'auto'; select.addEventListener('change',()=>{localStorage.setItem('wp-mcp-hub-language',select.value);location.reload();}); }
    initI18n().then(()=>{setupSiteViewControl();setupInlineSiteNames();setupActivitySiteFilter();setupAuthenticationControls();setupAuthModeButtons();setupLanguageControl();});
  </script>
  <dialog id="action-dialog"><div class="dialog-body"><h3 class="dialog-title" id="action-title"></h3><div class="action-status" id="action-status"><span class="spinner"></span><span></span></div><textarea id="action-log" class="action-log" readonly></textarea><div class="dialog-actions"><button class="button" id="action-close" onclick="closeActionDialog()" data-i18n="execution.close"></button></div></div></dialog>
